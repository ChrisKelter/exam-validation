<p-toast></p-toast>
<p-card header="Validierungen" class="h-full flex flex-col">
  <div class="flex-1 min-h-0 overflow-hidden">
    <p-table #dt1
             [scrollable]="true"
             scrollHeight="calc(100vh - 300px)"
             [value]="validations" [lazy]="true" (onLazyLoad)="loadTable($event)" [lazyLoadOnInit]="true"  [rows]="10" [rowsPerPageOptions]="[10, 25, 50]" [loading]="loading" [paginator]="true" [totalRecords]="totalRecords"  showGridlines>
      <ng-template #caption>
        <div class="flex">
          <p-button label="Neuer Eintrag" [outlined]="true" icon="pi pi-plus" (click)="openCreateDialog()" />
          <p-iconfield iconPosition="left" class="ml-auto">
            <p-inputicon>
              <i class="pi pi-search"></i>
            </p-inputicon>
            <input pInputText type="text" placeholder="Suchen ..." (input)="onSearch($event)" />
          </p-iconfield>
        </div>
      </ng-template>
      <ng-template #header>
        <tr>
          <th style="min-width:7rem">
            <div class="flex items-center justify-between">
              Matrikel-Nr.
            </div>
          </th>
          <th style="min-width:20rem">
            <div class="flex items-center justify-between">
              Email
            </div>
          </th>
          <th style="min-width:15rem">
            <div class="flex items-center justify-between">
              Type
            </div>
          </th>
          <th style="min-width:10rem">
            <div class="flex items-center justify-between">
              Status
            </div>
          </th>
          <th style="min-width:10rem">
            <div class="flex items-center justify-between">
              Letzte Änderung
            </div>
          </th>
          <th>
            <div class="flex items-center justify-between">
              Aktion
            </div>
          </th>
        </tr>
      </ng-template>
      <ng-template #body let-validation>
        <tr>
          <td>
            {{ validation.studentId }}
          </td>
          <td>
            {{ validation.email }}
          </td>
          <td>
            <p-tag [value]="validation.type" [severity]="getSeverityType(validation.status)" />
          </td>
          <td>
            <p-tag [value]="validation.statusValue" [severity]="getSeverityStatus(validation.status)" />
          </td>
          <td>
            {{ validation.lastUpdate | date: 'MM/dd/yyyy' }}
          </td>
          <td>
            <p-button class="mr-2" icon="pi pi-pencil" severity="info" (click)="openUpdateDialog(validation)" />
            <p-button icon="pi pi-times" severity="danger" />
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="5">Keine Studierenden gefunden.</td>
        </tr>
      </ng-template>
    </p-table>
  </div>

</p-card>


<p-dialog header="Validierung" [(visible)]="dialogVisible" [style]="{ width: '25rem' }" [modal]="true" [draggable]="false">
  <form [formGroup]="validationForm" class="w-full">
    <div class="mt-6 w-full">
      <p-floatlabel>
        <input pInputText class="w-full" id="student_id" formControlName="studentId">
        <label for="student_id">Matrikel-Nr.</label>
      </p-floatlabel>

    </div>

    <div class="mt-6 w-full">
      <p-floatlabel>
        <input pInputText class="w-full" id="email" formControlName="email">
        <label for="email">Email</label>
      </p-floatlabel>

    </div>

    <div class="mt-6 w-full">
      <p-floatlabel>
        <p-datepicker formControlName="validUntil" inputId="valid_until" showIcon iconDisplay="input" dateFormat="dd.mm.yy" class="w-full" inputStyleClass="w-full" appendTo="body" />
        <label for="valid_until">Gültig bis</label>
      </p-floatlabel>
    </div>

    <div class="mt-6">
      <p-button label="Speichern" severity="info" class="mr-2" (click)="onSave()"/>
      <p-button label="Abbrechen" severity="warn" (click)="closeDialog()"/>
    </div>
  </form>
</p-dialog>
