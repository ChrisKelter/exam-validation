<p-toast></p-toast>
<p-card header="Benutzerverwaltung" class="h-full flex flex-col">
  <div class="flex-1 min-h-0 overflow-hidden">
    <p-table #dt1  [value]="users"
             [scrollable]="true"
             scrollHeight="calc(100vh - 300px)"
             [lazyLoadOnInit]="true" dataKey="id" [rows]="10"
             [rowsPerPageOptions]="[10, 25, 50]" [loading]="loading"
             [globalFilterFields]="['firstName', 'lastName', 'email']"
             [paginator]="true" showGridlines>
      <ng-template #caption>
        <div class="flex">
          <p-button label="Neuer Eintrag" [outlined]="true" icon="pi pi-plus" (click)="openCreateDialog()" />
          <p-iconfield iconPosition="left" class="ml-auto">
            <p-inputicon>
              <i class="pi pi-search"></i>
            </p-inputicon>
            <input pInputText type="text" placeholder="Suchen ..." (input)="onSearch($event)" />
          </p-iconfield>
        </div>
      </ng-template>
      <ng-template #header>
        <tr>
          <th style="min-width:15rem">
            <div class="flex items-center justify-between">
              Vorname
            </div>
          </th>
          <th style="min-width:15rem">
            <div class="flex items-center justify-between">
              Nachname
            </div>
          </th>
          <th style="min-width:15rem">
            <div class="flex items-center justify-between">
              Email
            </div>
          </th>
          <th style="min-width:10rem">
            <div class="flex items-center justify-between">
              Rollen
            </div>
          </th>
          <th>
            <div class="flex items-center justify-between">
              Aktion
            </div>
          </th>
        </tr>
      </ng-template>
      <ng-template #body let-user>
        <tr>
          <td>
            {{ user.firstName }}
          </td>
          <td>
            {{ user.lastName }}
          </td>
          <td>
            {{ user.email }}
          </td>
          <td>
            @for (role of user.authorities; track $index) {
              <p-tag [value]="role" severity="info" class="mr-2" />
            }

          </td>
          <td>
            <p-button class="mr-2" icon="pi pi-pencil" severity="info" (click)="openUpdateDialog(user)" />
            <p-button icon="pi pi-times" severity="danger" />
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="5">Keine Studierenden gefunden.</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</p-card>


<p-dialog header="Validierung" [(visible)]="dialogVisible" [style]="{ width: '25rem' }" [modal]="true" [draggable]="false">
  <form [formGroup]="userForm" class="w-full">
    <div class="mt-6 w-full">
      <p-floatlabel>
        <input pInputText class="w-full" id="email" formControlName="email">
        <label for="email">Email</label>
      </p-floatlabel>
    </div>

    <div class="mt-6 w-full">
      <p-floatlabel>
        <input pInputText class="w-full" id="firstName" formControlName="firstName">
        <label for="firstName">Vorname</label>
      </p-floatlabel>
    </div>

    <div class="mt-6 w-full">
      <p-floatlabel>
        <input pInputText class="w-full" id="lastName" formControlName="lastName">
        <label for="lastName">Nachname</label>
      </p-floatlabel>
    </div>

    <div class="mt-6 w-full">
      <p-floatlabel>
        <p-password inputId="password" formControlName="password" class="w-full" inputStyleClass="w-full" [feedback]="false" autocomplete="off" />
        <label for="password">Kennwort</label>
      </p-floatlabel>
    </div>

    <div class="mt-6 w-full">
      <p-floatlabel>
        <p-multiselect formControlName="authorities" [options]="AUTHORITY_OPTIONS" [filter]="false" display="chip" class="w-full" appendTo="body" />
        <label for="valid_until">Rollen</label>
      </p-floatlabel>
    </div>

    <div class="mt-6">
      <p-button label="Speichern" severity="info" class="mr-2" (click)="onSave()" [disabled]="userForm.invalid"/>
      <p-button label="Abbrechen" severity="warn" (click)="closeDialog()"/>
    </div>
  </form>
</p-dialog>
